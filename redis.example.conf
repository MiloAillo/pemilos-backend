# Redis ACL Configuration for Pemilos Backend
#
# SECURITY MODEL:
# - Admin user: Full access for maintenance and monitoring
# - Application user: Restricted access for runtime operations
# - Default user: Disabled for security hardening
#
# SETUP INSTRUCTIONS:
# 1. Generate strong passwords:
#    openssl rand -base64 32
# 2. Replace CHANGE_THIS_* placeholders below
# 3. Update REDIS_USERNAME and REDIS_PASSWORD in .env.prod
# 4. Restart Redis container

# =============================================================================
# ADMIN USER - Full Access
# =============================================================================
user admin on >Pemilos2026Admin! ~* +@all

# =============================================================================
# APPLICATION USER - Restricted Access
# =============================================================================
user appuser on >Pemilos2026User! ~rate-limit:* ~vote:* ~user:* +@read +@write +@sortedset +expire -@dangerous

# =============================================================================
# DEFAULT USER - Disabled
# =============================================================================
user default off nopass

# =============================================================================
# FALLBACK PASSWORD - Removed
# =============================================================================
requirepass ""