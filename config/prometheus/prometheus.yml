global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

# Retention: 7 days (saves ~300MB disk space vs 15 days default)
storage:
  tsdb:
    retention.time: 7d

scrape_configs:
  # System metrics from Node Exporter
  - job_name: node_exporter
    static_configs:
      - targets: ["node_exporter:9100"]
  
  # MongoDB metrics
  - job_name: mongo
    static_configs:
      - targets: ["mongodb_exporter:9216"]
  
  # Application metrics (HTTP, votes, latency)
  - job_name: app
    static_configs:
      - targets: ["app:8000"]
    metrics_path: /metrics
    scrape_interval: 10s  # More frequent for real-time vote tracking