  local-redis-pemilos:
    image: redis:7-alpine
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "6379:6379"
    # networks:
    #   - pemilos_network

  local-mongo-pemilos:
    image: mongo:4.4.18
    volumes:
      - pemilos_mongo_local:/data/db
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGODB_ROOT_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGODB_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGODB_DATABASE}
    env_file:
      - .env
    # networks:
    #   - pemilos_network

# networks:
#   pemilos_network:

volumes:
  pemilos_mongo_local:
