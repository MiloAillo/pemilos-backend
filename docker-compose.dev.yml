services:
  app:
    build:
      context: .
      dockerfile: ./backend/Dockerfile.dev
    environment:
      - NODE_ENV=development
    env_file:
      - .env.dev
    volumes:
      - ./backend/src:/app/src:ro
      - ./backend/logs:/app/logs
      - ./backend/uploads:/app/uploads

  mongo_db:
    env_file:
      - .env.dev
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGODB_ROOT_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGODB_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGODB_DATABASE}

  redis:
    env_file:
      - .env.dev
    ports:
      - "6379:6379"

  grafana:
    env_file:
      - .env.dev
    ports:
      - "3000:3000"

  prometheus:
    env_file:
      - .env.dev
    environment:
      - MONGODB_HOST=${MONGODB_HOST}
      - MONGODB_PORT=${MONGODB_PORT}
      - NODE_EXPORTER_HOST=${NODE_EXPORTER_HOST}
      - NODE_EXPORTER_PORT=${NODE_EXPORTER_PORT}

  loki:
    env_file:
      - .env.dev
    ports:
      - "3100:3100"

  mongodb_exporter:
    env_file:
      - .env.dev
    environment:
      MONGODB_URI: mongodb://${MONGODB_ROOT_USER}:${MONGODB_ROOT_PASSWORD}@${MONGODB_HOST}:${MONGODB_PORT}
    ports:
      - "9216:9216"

  node_exporter:
    env_file:
      - .env.dev

  promtail:
    env_file:
      - .env.dev
