services:
  app:
    ports:
      - "${APP_PORT_EXTERNAL:-5000}:${APP_PORT:-8000}"
    networks:
      - pemilos_network
    depends_on:
      mongo_db:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    networks:
      - pemilos_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mongo_db:
    image: mongo:4.4.18
    volumes:
      - pemilos_mongo:/data/db
      - ./config/mongo:/docker-entrypoint-initdb.d
    networks:
      - pemilos_network
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  grafana:
    image: grafana/grafana-oss
    container_name: grafana
    volumes:
      - grafana_storage:/var/lib/grafana
      - ./config/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./config/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./config/grafana:/etc/grafana/provisioning/dashboards/json:ro
    networks:
      - pemilos_network

  node_exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
      - --collector.interrupts
      - --collector.processes
      - --path.udev.data=/rootfs/run/udev/data
    expose:
      - 9100
    networks:
      - pemilos_network

  mongodb_exporter:
    image: percona/mongodb_exporter:0.40.0
    command: ["--collect-all", "--compatible-mode", "--discovering-mode"]
    networks:
      - pemilos_network
    depends_on:
      - mongo_db

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
    expose:
      - 9090
    networks:
      - pemilos_network

  loki:
    image: grafana/loki:3.4.1
    command: -config.file=/etc/loki/local-config.yml
    volumes:
      - ./config/loki/loki.yml:/etc/loki/local-config.yml:ro
      - loki_data:/loki
    networks:
      - pemilos_network

  promtail:
    image: grafana/promtail:3.4.1
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./config/promtail/promtail.yml:/etc/promtail/config.yml:ro
      - /var/log/nginx:/var/log/nginx
    networks:
      - pemilos_network

networks:
  pemilos_network:

volumes:
  pemilos_mongo:
  grafana_storage:
  prometheus_data:
  loki_data:
